<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shared counter</title>
<style>
 body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;background:#0f1115;color:#eee}
 .c{text-align:center}.n{font-size:96px;font-weight:700;margin:10px 0}
 button{font-size:28px;width:72px;height:72px;margin:6px;border-radius:50%;border:0;background:#5b8def;color:#fff;cursor:pointer}
 .m{color:#999;font-size:14px}
</style></head><body><div class="c">
 <div class="m">共享计数器 · Shared counter</div>
 <div class="n" id="n">0</div>
 <button id="dec">−</button><button id="inc">+</button>
 <div class="m"><span id="p">1</span> 人在线 online · <span id="s">connecting</span></div>
</div>
<script>
 const n=document.getElementById("n");
 const render=()=>{n.textContent=artifact.get("count",0);};
 artifact.subscribe(render); render();
 document.getElementById("inc").onclick=()=>artifact.set("count",artifact.get("count",0)+1);
 document.getElementById("dec").onclick=()=>artifact.set("count",artifact.get("count",0)-1);
 artifact.onPresence(c=>document.getElementById("p").textContent=c);
 artifact.onStatus(s=>document.getElementById("s").textContent=s);
</script></body></html>
