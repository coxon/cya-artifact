name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Dependencies are installed above; tests use only local workerd/loopback,
      # generated test credentials, and fresh SQLite storage. No deploy step.
      - run: npm test
        env:
          WRANGLER_SEND_METRICS: "false"
          CLOUDFLARE_CF_FETCH_ENABLED: "false"
